# PARKSIDE Smart battery 12 Ah -- experimental.
#
# Source: ha-tuya-ble/ha_tuya_ble PR 283 (@kleju00), which lists fay1puxy as a
# 12 Ah pack sharing the 2026 vllfabvs data-point layout. No diagnostics from
# this PID exist, so only read-only sensors are mapped:
# - DP 102 battery status is omitted: PR 283's option order conflicts with the
#   order observed on the 2026 4/8 Ah packs (#103), so the codes are unknown.
# - DP 101 is in amperes, as both PR 283 and the #103 field report agree.
# - Configuration switches, numbers, the work-mode select (DP 105) and the
#   Identify switch (DP 115) are deferred until a diagnostics download confirms
#   the writable data points.
