category: kg
product_id: riecov42
entities:
  sensor:
    - dp_id: 105
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
  button:
    - dp_id: 108
      translation_key: push
      handlers:
        when: fingerbot.mode.in_push_mode
  number:
    - dp_id: 102
      translation_key: down_position
      mode: box
      handlers:
        when: fingerbot.mode.not_in_program_mode
      min_value: 50
      max_value: 100
      step: 1
      icon: mdi:arrow-down-bold
      unit: "%"
      entity_category: config
    - dp_id: 103
      translation_key: hold_time
      mode: box
      handlers:
        when: fingerbot.mode.in_push_mode
      min_value: 0
      max_value: 10
      step: 1
      icon: mdi:timer
      unit: s
      entity_category: config
    - dp_id: 106
      translation_key: up_position
      mode: box
      handlers:
        when: fingerbot.mode.not_in_program_mode
      min_value: 0
      max_value: 50
      step: 1
      icon: mdi:arrow-up-bold
      unit: "%"
      entity_category: config
    - dp_id: 109
      translation_key: program_repeats_count
      icon: mdi:repeat
      entity_category: config
      mode: box
      handlers:
        read: fingerbot.program.get_repeat_count
        write: fingerbot.program.set_repeat_count
        when: fingerbot.mode.repeat_count_available
      min_value: 1
      max_value: 65534
      step: 1
    - dp_id: 109
      translation_key: program_idle_position
      icon: mdi:repeat
      unit: "%"
      entity_category: config
      mode: box
      handlers:
        read: fingerbot.program.get_position
        write: fingerbot.program.set_position
        when: fingerbot.mode.in_program_mode
      min_value: 0
      max_value: 100
      step: 1
  select:
    - dp_id: 101
      translation_key: fingerbot_mode
      entity_category: config
      options:
        - push
        - switch
        - program
  switch:
    - dp_id: 1
      translation_key: switch
      handlers:
        when: fingerbot.mode.in_switch_mode
    - dp_id: 104
      translation_key: reverse_positions
      icon: mdi:arrow-up-down-bold
      entity_category: config
      handlers:
        when: fingerbot.mode.in_switch_mode
    - dp_id: 107
      translation_key: manual_control
      icon: mdi:gesture-tap-box
      entity_category: config
    - dp_id: 1
      translation_key: program
      icon: mdi:repeat
      handlers:
        when: fingerbot.mode.in_program_mode
    - dp_id: 109
      translation_key: program_repeat_forever
      icon: mdi:repeat
      entity_category: config
      handlers:
        read: fingerbot.program.get_repeat_forever
        write: fingerbot.program.set_repeat_forever
        when: fingerbot.mode.in_program_mode
  text:
    - dp_id: 109
      translation_key: program
      icon: mdi:repeat
      pattern: ^([0-9]{1,3}(/[0-9]{1,4})?(;[0-9]{1,3}(/[0-9]{1,4})?)*)?$
      min_length: 0
      max_length: 255
      entity_category: config
      handlers:
        read: fingerbot.program.get_program
        write: fingerbot.program.set_program
        when: fingerbot.mode.in_program_mode
device_name: Fingerbot Plus
model_name: riecov42
