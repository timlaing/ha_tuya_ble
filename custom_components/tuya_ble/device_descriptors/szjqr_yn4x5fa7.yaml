category: szjqr
product_id: yn4x5fa7
entities:
  number:
    - dp_id: 3
      translation_key: hold_time
      coefficient: 10.0
      mode: box
      handlers:
        when: fingerbot.mode.in_push_mode
      kind: hold_time
      min_value: 0.3
      max_value: 10
      step: 0.1
      icon: mdi:timer
      unit: s
      entity_category: config
    - dp_id: 4
      translation_key: up_position
      icon: mdi:arrow-up-bold
      unit: "%"
      entity_category: config
      mode: box
      handlers:
        when: fingerbot.mode.not_in_program_mode
      min_value: 0
      max_value: 30
      step: 1
    - dp_id: 5
      translation_key: down_position
      icon: mdi:arrow-down-bold
      unit: "%"
      entity_category: config
      mode: box
      handlers:
        when: fingerbot.mode.not_in_program_mode
      min_value: 0
      max_value: 30
      step: 1
  switch:
    - dp_id: 1
      translation_key: switch
      handlers:
        when: fingerbot.mode.in_switch_mode
      kind: TuyaBLEFingerbotSwitchMapping
    - dp_id: 6
      translation_key: reverse_positions
      icon: mdi:arrow-up-down-bold
      entity_category: config
      handlers:
        when: fingerbot.mode.in_switch_mode
      kind: TuyaBLEReversePositionsMapping
device_name: Nedis SmartLife Finger Robot
model_name: yn4x5fa7
