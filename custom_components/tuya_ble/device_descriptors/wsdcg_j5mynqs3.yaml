category: wsdcg
product_id: j5mynqs3
entities:
  sensor:
    # DP 1 is mapped as whole degrees, as tuya-local does. The cloud schema
    # claims scale 1, but the cloud reported 14 for an outdoor soil reading,
    # which fits whole degrees. Not yet verified over BLE.
    - dp_id: 1
      translation_key: temperature
      device_class: temperature
      unit: °C
      state_class: measurement
    - dp_id: 2
      translation_key: moisture
      device_class: moisture
      unit: "%"
      state_class: measurement
    - dp_id: 4
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
device_name: TCS024B Soil Moisture Sensor
model_name: j5mynqs3
manufacturer: RainPoint
