category: co2bj
product_id: 59s19z5m
entities:
  sensor:
    - dp_id: 1
      translation_key: carbon_dioxide_alarm
      icon: mdi:molecule-co2
      device_class: enum
      options:
        - alarm
        - normal
      handlers:
        when: co2.alarm_enabled
    - dp_id: 2
      translation_key: carbon_dioxide
      device_class: carbon_dioxide
      unit: ppm
      state_class: measurement
    - dp_id: 15
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
      kind: battery
    - dp_id: 18
      translation_key: temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      kind: temperature
    - dp_id: 19
      translation_key: humidity
      device_class: humidity
      unit: "%"
      state_class: measurement
  number:
    - dp_id: 17
      translation_key: brightness
      icon: mdi:brightness-percent
      unit: "%"
      entity_category: config
      mode: slider
      min_value: 0
      max_value: 100
      step: 1
    - dp_id: 26
      translation_key: carbon_dioxide_alarm_level
      icon: mdi:molecule-co2
      unit: ppm
      entity_category: config
      mode: box
      min_value: 400
      max_value: 5000
      step: 100
  select:
    - dp_id: 101
      translation_key: temperature_unit
      options:
        - °C
        - °F
  switch:
    - dp_id: 11
      translation_key: carbon_dioxide_severely_exceed_alarm
      icon: mdi:molecule-co2
      entity_category: config
      enabled_by_default: false
      bitmap_mask: !!binary |
        AQ==
    - dp_id: 11
      translation_key: low_battery_alarm
      icon: mdi:battery-alert
      entity_category: config
      enabled_by_default: false
      bitmap_mask: !!binary |
        Ag==
    - dp_id: 13
      translation_key: carbon_dioxide_alarm_switch
      icon: mdi:molecule-co2
      entity_category: config
device_name: CO2 Detector
model_name: 59s19z5m
