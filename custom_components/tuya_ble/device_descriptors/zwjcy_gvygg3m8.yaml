category: zwjcy
product_id: gvygg3m8
entities:
  sensor:
    - dp_id: 5
      translation_key: temp_current
      name: Soil temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    # DP 3 is the cloud "humidity" code, but it is the soil reading, so it uses
    # the moisture class. The legacy key keeps the existing unique ID.
    - dp_id: 3
      translation_key: moisture
      legacy_keys: [humidity]
      device_class: moisture
      unit: "%"
      state_class: measurement
    - dp_id: 14
      translation_key: battery_state
      icon: mdi:battery
      device_class: enum
      entity_category: diagnostic
      options:
        - low
        - normal
        - high
      icons:
        - mdi:battery-alert
        - mdi:battery-50
        - mdi:battery-check
    - dp_id: 15
      translation_key: battery_percentage
      name: Battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
device_name: Smartlife Plant Sensor SGS01
model_name: gvygg3m8
