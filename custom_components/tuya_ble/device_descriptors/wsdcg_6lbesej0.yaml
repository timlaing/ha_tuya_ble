# Experimental. DP IDs from ha-tuya-ble/ha_tuya_ble#186 (based on
# Sathen/ha_tuya_ble#1). No cloud schema has been captured; calibration and
# temperature-unit DPs were deliberately left out by the source.
# The legacy keys keep entity unique IDs from that fork.
category: wsdcg
product_id: 6lbesej0
device_name: SS302 Temperature Humidity Sensor
model_name: 6lbesej0
entities:
  sensor:
    - dp_id: 1
      translation_key: temperature
      legacy_keys: [temp_current]
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    - dp_id: 2
      translation_key: humidity
      legacy_keys: [humidity_value]
      device_class: humidity
      unit: "%"
      state_class: measurement
    - dp_id: 4
      translation_key: battery
      legacy_keys: [battery_percentage]
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
