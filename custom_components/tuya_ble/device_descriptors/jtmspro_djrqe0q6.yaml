category: jtmspro
product_id: djrqe0q6
device_name: Smart Lock C-014S
model_name: C-014S
sensitive_dp_ids: [71]
entities:
  event:
    - dp_id: 24
      translation_key: doorbell
      device_class: doorbell
      dp_type: 1
      event_values:
        true: ring
  lock:
    - dp_id: 47
      translation_key: lock
      dp_type: 1
      manual_lock_dp_id: 46
      unlock_dp_id: 71
      handlers:
        read: lock.state.reported_bolt
        write: lock.command.manual_lock_or_raw_unlock
  binary_sensor:
    - dp_id: 47
      translation_key: lock_motor_state
      device_class: lock
      entity_category: diagnostic
      dp_type: 1
  switch:
