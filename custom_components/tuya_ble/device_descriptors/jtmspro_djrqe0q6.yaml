      translation_key: automatic_lock
      icon: mdi:lock-clock
      entity_category: config
      dp_type: 1
  number:
    - dp_id: 36
      translation_key: auto_lock_time
      icon: mdi:lock-clock
      unit: s
      min_value: 3
      max_value: 600
      step: 1
      entity_category: config
      dp_type: 2
  select:
    - dp_id: 31
      translation_key: beep_volume
      icon: mdi:volume-high
      options: [mute, low, normal, high]
      entity_category: config
      dp_type: 4
    - dp_id: 34
      translation_key: unlock_switch
      icon: mdi:shield-lock-outline
      options: [single_unlock, combination]
      entity_category: config
      dp_type: 4
  sensor:
