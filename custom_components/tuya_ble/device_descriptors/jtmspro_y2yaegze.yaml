# Issue 154 schema confirms the diagnostic IDs; #218 adds the owner-verified
# control path from ha-tuya-ble/ha_tuya_ble#361: DP47 reports the bolt state,
# DP46 locks, DP71 unlocks with the stored cloud ble_unlock_check value.
category: jtmspro
product_id: y2yaegze
device_name: Drawer Lock CTL20H
model_name: CTL20H
sensitive_dp_ids: [71]
entities:
  lock:
    - dp_id: 47
      translation_key: lock
      dp_type: 1
      manual_lock_dp_id: 46
      unlock_dp_id: 71
      open_dp_id: 71
      handlers:
        read: lock.state.reported_bolt
        write: lock.command.manual_lock_or_stored_check_unlock
        open: lock.command.stored_check_open
  sensor:
    - dp_id: 8
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
    - dp_id: 15
      translation_key: unlock_card
      icon: mdi:nfc-variant
      entity_category: diagnostic
    - dp_id: 19
      translation_key: unlock_ble
      icon: mdi:bluetooth
      entity_category: diagnostic
    - dp_id: 62
      translation_key: unlock_phone_remote
      icon: mdi:cellphone-lock
      entity_category: diagnostic
  binary_sensor:
    - dp_id: 33
      translation_key: automatic_lock
      name: Automatic lock
      entity_category: diagnostic
