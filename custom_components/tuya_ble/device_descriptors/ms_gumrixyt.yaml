# Issue 220: cloud local_strategy for this firmware has no DP 40 or 47.
# DP 8 (battery) and DP 33 (automatic_lock) were reported and written over BLE.
# DP 60/61 are the standard passwordless key pair (remote_no_pd_setkey /
# remote_no_dp_key); DP 61 carries the one-time unlock command, not a bolt
# report, so the lock's state stays unknown.
category: ms
product_id: gumrixyt
device_name: Smart Lock
model_name: gumrixyt
sensitive_dp_ids: [60, 61]
entities:
  lock:
    - dp_id: 61
      translation_key: lock
      dp_type: 0
      set_key_dp_id: 60
      unlock_key_dp_id: 61
      handlers:
        read: lock.state.unknown
        write: lock.command.passwordless_key_lock
        open: lock.command.passwordless_key_open
  switch:
    - dp_id: 33
      translation_key: automatic_lock
      entity_category: config
  sensor:
    - dp_id: 21
      translation_key: alarm_lock
      device_class: enum
      options:
        - low_battery
    - dp_id: 8
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
