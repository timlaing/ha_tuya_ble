# Source: ha-tuya-ble/ha_tuya_ble PR 355, @3XX0 (owner-tested).
# See docs/devices/miboxer-bs64.md for evidence and intentionally deferred DPs.
category: dj
product_id: c2twgywo
manufacturer: MiBoxer
model_name: BS64
device_name: BS64 Stair Light Controller
entities:
  light:
    - translation_key: switch_led
      name: Light
      mode_dp_id: 114
      on_value: 1
      off_value: 2
      white_value: 0
      color_mode_dp_id: 2
      brightness_dp_id: 3
      brightness_min: 10
      brightness_max: 1000
      handlers:
        read: light.mode_is_on
        write: light.write_mode
  select:
    - dp_id: 114
      dp_type: 4
      translation_key: stair_mode
      icon: mdi:stairs
      options: [auto, "on", "off"]
    - dp_id: 104
      dp_type: 4
      translation_key: auto_effect
      icon: mdi:stairs-up
      entity_category: config
      options: [full, gradual, following, flowing]
