category: kg
product_id: bs3ubslo
device_name: Fingerbot Touch
model_name: bs3ubslo
entities:
  number:
    # The device reports and accepts touch duration in milliseconds.
    - dp_id: 103
      translation_key: touch_duration_1
      name: 1-04 Touch duration
      mode: box
      min_value: 0.1
      max_value: 10
      step: 0.1
      coefficient: 1000.0
      icon: mdi:timer
      unit: s
      entity_category: config
    - dp_id: 104
      translation_key: touch_duration_2
      name: 2-04 Touch duration
      mode: box
      min_value: 0.1
      max_value: 10
      step: 0.1
      coefficient: 1000.0
      icon: mdi:timer
      unit: s
      entity_category: config
    - dp_id: 117
      translation_key: touch_off_duration_1
      name: 1-05 OFF touch duration
      mode: box
      min_value: 0.1
      max_value: 10
      step: 0.1
      coefficient: 1000.0
      icon: mdi:timer-off
      unit: s
      entity_category: config
      handlers:
        when: fingerbot.touch.channel_1_in_switch_mode
    - dp_id: 118
      translation_key: touch_off_duration_2
      name: 2-05 OFF touch duration
      mode: box
      min_value: 0.1
      max_value: 10
      step: 0.1
      coefficient: 1000.0
      icon: mdi:timer-off
      unit: s
      entity_category: config
      handlers:
        when: fingerbot.touch.channel_2_in_switch_mode
    - dp_id: 119
      translation_key: double_tap_interval_1
      name: 1-02 Double-tap interval
      mode: box
      min_value: 0
      max_value: 100
      step: 1
      icon: mdi:gesture-double-tap
      unit: ms
      entity_category: config
    - dp_id: 120
      translation_key: double_tap_interval_2
      name: 2-02 Double-tap interval
      mode: box
      min_value: 0
      max_value: 100
      step: 1
      icon: mdi:gesture-double-tap
      unit: ms
      entity_category: config
  select:
    - dp_id: 101
      translation_key: fingerbot_mode_1
      name: 1-01 Mode
      entity_category: config
      options:
        - Push
        - Switch
        - Program
    - dp_id: 102
      translation_key: fingerbot_mode_2
      name: 2-01 Mode
      entity_category: config
      options:
        - Push
        - Switch
        - Program
  sensor:
    - dp_id: 115
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
  switch:
    # Keep the existing channel switch keys for automations and bridges.
    - dp_id: 1
      translation_key: switch
      name: Switch 1
      icon: mdi:gesture-tap
      handlers:
        when: fingerbot.touch.channel_1_can_switch
        pulse: fingerbot.touch.push_duration
    - dp_id: 2
      translation_key: switch_2
      name: Switch 2
      icon: mdi:gesture-tap
      handlers:
        when: fingerbot.touch.channel_2_can_switch
        pulse: fingerbot.touch.push_duration
    - dp_id: 105
      translation_key: touch_switch_1
      name: 1-06 Touch input
      icon: mdi:gesture-tap
      entity_category: config
    - dp_id: 106
      translation_key: touch_switch_2
      name: 2-06 Touch input
      icon: mdi:gesture-tap
      entity_category: config
    - dp_id: 107
      translation_key: switch_invert_1
      name: 1-03 Invert switch
      icon: mdi:swap-horizontal
      entity_category: config
    - dp_id: 108
      translation_key: switch_invert_2
      name: 2-03 Invert switch
      icon: mdi:swap-horizontal
      entity_category: config
