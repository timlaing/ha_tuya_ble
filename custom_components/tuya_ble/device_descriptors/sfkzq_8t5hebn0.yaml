# MoistenLand water timer. Experimental: not tested over BLE.
# DP IDs, value ranges and enum values come from the model-specific tuya-local
# descriptor `moistenland_water_timer.yaml` (ha-tuya-ble/ha_tuya_ble#273). The
# codes match Tuya's standard water-timer DPs, so the ENUM index order follows
# the cloud ranges published for the YZD05 (`sfkzq_d4vpmigg.yaml`); tuya-local
# addresses enums by name and does not fix the order.
#   DP1  switch              bool                            rw
#   DP4  fault               bitmap, 0 = no fault            ro
#   DP7  battery_percentage  value %, scale 0                ro
#   DP8  battery_state       enum [low, middle, high]        ro
#   DP10 weather_delay       enum [cancel, 24h, 48h, 72h]    rw
#   DP11 countdown           value 0-86400 s, scale 0        rw
#   DP12 work_state          enum [auto, manual, idle]       ro
#   DP15 use_time_one        value 0-86400 s, scale 0        ro (optional)
# The source fork filed the DP11 number under the CO2 detector category, so it
# never applied to this timer; it is mapped here from the tuya-local range.
category: sfkzq
product_id: 8t5hebn0
device_name: Water timer
model_name: 8t5hebn0
manufacturer: MoistenLand
entities:
  sensor:
    - dp_id: 7
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
    - dp_id: 8
      translation_key: battery_state
      device_class: enum
      entity_category: diagnostic
      options:
        - low
        - middle
        - high
    - dp_id: 12
      translation_key: work_state
      name: Operation
      device_class: enum
      options:
        - auto
        - manual
        - idle
    - dp_id: 15
      translation_key: use_time_one
      name: Use time
      device_class: duration
      unit: s
      state_class: measurement
      entity_category: diagnostic
  binary_sensor:
    - dp_id: 4
      translation_key: fault_code
      name: Fault
      device_class: problem
      entity_category: diagnostic
      dp_type: 5
  number:
    - dp_id: 11
      translation_key: countdown
      name: Irrigation time
      icon: mdi:timer
      unit: s
      mode: box
      min_value: 0
      max_value: 86400
      step: 1
  switch:
    - dp_id: 1
      translation_key: water_valve
      icon: mdi:valve
  valve:
    - dp_id: 1
      translation_key: valve
      device_class: water
  select:
    - dp_id: 10
      translation_key: weather_delay
      name: Weather delay
      icon: mdi:weather-partly-cloudy
      entity_category: config
      dp_type: 4
      options:
        - cancel
        - 24h
        - 48h
        - 72h
