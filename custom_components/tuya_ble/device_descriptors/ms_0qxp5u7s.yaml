# ha-tuya-ble/ha_tuya_ble PRs 324/327, tested by @way-lo.
category: ms
product_id: 0qxp5u7s
device_name: Pulido PLD_P130 Smart Lever Lock
model_name: PLD_P130
manufacturer: Pulido
entities:
  lock:
    - dp_id: 47
      translation_key: lock
      passage_dp_id: 33
      manual_lock_dp_id: 46
      open_dp_id: 6
      handlers:
        read: lock.state.passage_or_bolt
        write: lock.command.manual_lock_or_passage
        open: lock.command.momentary_open
  button:
    - dp_id: 6
      translation_key: bluetooth_unlock
      dp_type: 1
      press_value: true
  switch:
    - dp_id: 33
      translation_key: free_passage_mode
      icon: mdi:door-open
      entity_category: config
  sensor:
    - dp_id: 8
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
    - dp_id: 12
      translation_key: unlock_fingerprint
      icon: mdi:fingerprint
      entity_category: diagnostic
    - dp_id: 19
      translation_key: unlock_ble
      icon: mdi:bluetooth
      entity_category: diagnostic
