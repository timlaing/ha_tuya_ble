# BTH08 Smart Meat Thermometer -- experimental. From the unmerged
# ha-tuya-ble/ha_tuya_ble#344 by @crebain, which confirmed connection and
# authentication but not individual probe readings. DP1 battery %, probes on
# DP2-DP5, DP28 and DP29 as 0.1 degC values; which physical probe each DP
# reports is unconfirmed. Target temperatures, timers, unit and alarm DPs are
# not mapped.
category: swtz
product_id: o3nnpkat
device_name: BTH08 Smart Meat Thermometer
model_name: o3nnpkat
entities:
  sensor:
    - dp_id: 1
      translation_key: battery
      device_class: battery
      unit: "%"
      state_class: measurement
      entity_category: diagnostic
    - dp_id: 2
      translation_key: probe_1_temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    - dp_id: 3
      translation_key: probe_2_temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    - dp_id: 4
      translation_key: probe_3_temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    - dp_id: 5
      translation_key: probe_4_temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    - dp_id: 28
      translation_key: probe_5_temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
    - dp_id: 29
      translation_key: probe_6_temperature
      device_class: temperature
      unit: °C
      state_class: measurement
      coefficient: 10.0
