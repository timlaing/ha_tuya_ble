name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels:
      - feature
      - enhancement

  - title: "🐛 Bug Fixes"
    labels:
      - bug
      - fix

  - title: "🛠 Maintenance"
    labels:
      - maintenance
      - dependencies

  - title: "📚 Documentation"
    labels:
      - documentation

exclude-labels:
  - skip-changelog

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

version-resolver:
  major:
    labels:
      - major

  minor:
    labels:
      - minor
      - feature
      - enhancement

  patch:
    labels:
      - patch
      - bug
      - fix

  default: patch

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
