name: "Auto labeller"

# pull_request_target, not pull_request: PRs from forks get a read-only
# GITHUB_TOKEN under pull_request, so the labeller 403s with "Resource not
# accessible by integration". This job only reads the base repo's config and
# labels the PR — it never checks out or runs code from the fork.
# yamllint disable-line rule:truthy
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto_label:
    runs-on: ubuntu-latest
    steps:
      # runs autolabeler
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
