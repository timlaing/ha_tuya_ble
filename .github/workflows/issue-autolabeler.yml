name: "Auto label issues"

# Adds the triage label to every newly opened or reopened issue, regardless of
# whether it came from a form, a direct URL, the API or the CLI. Type labels are
# assigned deterministically by the issue forms instead, so no heuristic keyword
# matching is involved.
#
# yamllint disable-line rule:truthy
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  auto_label:
    name: Add triage label
    runs-on: ubuntu-latest

    steps:
      - name: Add triage label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "needs-triage"
