name: SonarQube

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  sonarqube:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Remove pull-request-controlled scanner configuration
        run: rm -f sonar-project.properties

      - name: Require SonarQube credentials
        if: env.SONAR_TOKEN == ''
        run: exit 1

      - name: SonarQube Scan (branch)
        if: github.event.workflow_run.event == 'push'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.projectKey=timlaing_ha_tuya_ble
            -Dsonar.organization=timlaing
            -Dsonar.projectName=ha_tuya_ble
            -Dsonar.sources=custom_components/tuya_ble
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.14
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Scan (pull request)
        if: github.event.workflow_run.event == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.projectKey=timlaing_ha_tuya_ble
            -Dsonar.organization=timlaing
            -Dsonar.projectName=ha_tuya_ble
            -Dsonar.sources=custom_components/tuya_ble
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.14
            -Dsonar.qualitygate.wait=true
            -Dsonar.pullrequest.key=${{ github.event.workflow_run.pull_requests[0].number }}
            -Dsonar.pullrequest.branch=${{ github.event.workflow_run.pull_requests[0].head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.workflow_run.pull_requests[0].base.ref }}
