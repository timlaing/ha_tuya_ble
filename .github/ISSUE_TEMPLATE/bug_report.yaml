name: Bug report
description: Report a problem with the Tuya BLE integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: "Output of `ha version` or from Settings > About"
      placeholder: "e.g. 2024.1.0"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: "From Settings > Integrations > Tuya BLE > umbrella icon"
      placeholder: "e.g. 0.1.9"
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device info
      description: "Product ID, category, and device name from the integration config"
      placeholder: "e.g. product_id: fdrbxxbg, category: sfkzq, Diivoo WT-05"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Enable debug logging for the integration, then paste the relevant log output.
        ```yaml
        logger:
          logs:
            custom_components.tuya_ble: debug
        ```
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (screenshots, HA config, etc.)
    validations:
      required: false
